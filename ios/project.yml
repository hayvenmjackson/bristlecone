# XcodeGen project spec. The GitHub workflow runs `xcodegen generate` here to make
# Bristlecone.xcodeproj, so the project file never has to be edited by hand.
name: Bristlecone
options:
  bundleIdPrefix: app.bristlecone
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "5.0"
targets:
  Bristlecone:
    type: application
    platform: iOS
    scheme: {}
    deploymentTarget: "16.0"
    sources:
      - path: Bristlecone/Sources
      - path: Bristlecone/Assets.xcassets
      - path: Bristlecone/Resources
      # The map UI is shared with the Android app and copied into the app as a folder named "web".
      - path: ../app/src/main/assets/web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bristlecone
        PRODUCT_NAME: Bristlecone
        INFOPLIST_FILE: Bristlecone/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Bristlecone/Bristlecone.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
