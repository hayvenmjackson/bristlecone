# Builds the Android debug APK with Gradle, so a test build is ready after every push.
name: Android build

on:
  push:
    branches: [main]
    # A version tag (v1.3.0) also publishes the build to a public GitHub Release.
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    # Pinned: this image ships the Android SDK, so no setup-android step is needed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Bristlecone-android
          path: app/build/outputs/apk/debug/*.apk

      - name: Attach to the public release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Both workflows run for the same tag; whichever gets there first creates the release.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Bristlecone ${TAG#v}" \
            --notes-file ".github/release-notes/$TAG.md" || true
          cp "$(ls app/build/outputs/apk/debug/*.apk | head -1)" "Bristlecone-${TAG#v}-android.apk"
          for i in 1 2 3 4 5; do gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "Bristlecone-${TAG#v}-android.apk" && break; sleep 15; done
