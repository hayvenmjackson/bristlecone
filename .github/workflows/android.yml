# Builds the Android debug APK with Gradle, so a test build is ready after every push.
name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Publishing a GitHub Release (tag v1.3.0 and so on) builds the app and attaches it.
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    # Pinned: this image ships the Android SDK, so no setup-android step is needed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Test shared weather model
        run: |
          node tools/jstest/weather-learned.test.js
          node tools/jstest/weather-trained.test.js
          node tools/jstest/weather-integration.test.js
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Bristlecone-android
          path: app/build/outputs/apk/debug/*.apk

      - name: Attach to the public release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Release notes come from .github/release-notes/<tag>.md when that file exists.
          if [ -f ".github/release-notes/$TAG.md" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Bristlecone ${TAG#v}" --notes-file ".github/release-notes/$TAG.md"
          fi
          cp "$(ls app/build/outputs/apk/debug/*.apk | head -1)" "Bristlecone-${TAG#v}-android.apk"
          for i in 1 2 3 4 5; do gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "Bristlecone-${TAG#v}-android.apk" && exit 0; sleep 15; done
          exit 1
