# Builds the iPhone and iPad app on a GitHub macOS runner. No Mac or Apple developer account
# is needed: the result is an unsigned .ipa (ad-hoc signed only to carry the Health
# entitlement), which AltStore or SideStore signs with your own Apple ID when installing.
name: iOS build

on:
  push:
    branches: [main]
    # A version tag (v1.3.0) also publishes the build to a public GitHub Release.
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Bristlecone.xcodeproj -scheme Bristlecone -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*Bristlecone|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/Bristlecone.app

      - name: Package the .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Bristlecone.app Payload/
          codesign --force --sign - --entitlements Bristlecone/Bristlecone.entitlements Payload/Bristlecone.app
          zip -qry Bristlecone-unsigned.ipa Payload
          ls -la Bristlecone-unsigned.ipa

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: Bristlecone-ios
          path: ios/Bristlecone-unsigned.ipa

      - name: Attach to the public release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Both workflows run for the same tag; whichever gets there first creates the release.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Bristlecone ${TAG#v}" \
            --notes-file ".github/release-notes/$TAG.md" || true
          cp ios/Bristlecone-unsigned.ipa "Bristlecone-${TAG#v}-ios-unsigned.ipa"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "Bristlecone-${TAG#v}-ios-unsigned.ipa"

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios/build.log
